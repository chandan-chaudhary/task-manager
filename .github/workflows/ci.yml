name: CI

on:
  push:
    branches:
      - main
  #     - master
  # pull_request:

jobs:
  frontend: # <--  Defines the frontend job
    name: Frontend - lint and build # <--  Name of the frontend job
    runs-on: ubuntu-latest # <--  Runs on the latest ubuntu
    defaults: # <--  Default values for the frontend job
      run: # <--  Run command
        working-directory: frontend # <--  Working directory for the frontend job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
      # - name: Install Vercel CLI
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   run: npm i -g vercel@latest
      # - name: Deploy to Vercel (production)
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   env:
      #     VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      #   run: |
      #     vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      #     vercel build --prod --token "$VERCEL_TOKEN"
      #     vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  backend: # <--  Defines the backend job
    name: Backend - build # <--  Name of the backend job
    runs-on: ubuntu-latest # <--  Runs on the latest ubuntu
    defaults: # <--  Default values for the backend job
      run: # <--  Run command
        working-directory: backend # <--  Working directory for the backend job
    steps: # <--  Steps for the backend job
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
